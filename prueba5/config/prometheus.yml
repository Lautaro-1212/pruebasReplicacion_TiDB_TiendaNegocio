global:
  scrape_interval: 15s

scrape_configs:

  - job_name: "tidb"
    static_configs:
      - targets:
          - "tidb:10080"

  - job_name: "tikv-docker"
    static_configs:
      - targets:
          - "tikv:20180"

  - job_name: "tikv-vm"
    http_sd_configs:
      - url: "http://host.docker.internal:3010/api/tikv/targets"
        refresh_interval: 15s

  - job_name: "pd"
    static_configs:
      - targets:
          - "pd:2379"